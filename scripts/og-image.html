<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #060e26;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Gradient mesh, mirroring the Hero section */
      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(120px);
      }

      .blob-brand-600 {
        top: -160px;
        left: -80px;
        width: 560px;
        height: 560px;
        background: rgba(28, 74, 158, 0.55);
      }

      .blob-brand-500 {
        top: -40px;
        right: -120px;
        width: 620px;
        height: 620px;
        background: rgba(42, 95, 191, 0.38);
      }

      .blob-gold {
        bottom: -200px;
        left: 34%;
        width: 520px;
        height: 520px;
        background: rgba(212, 175, 55, 0.26);
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.04;
        background-image: linear-gradient(to right, #fff 1px, transparent 1px),
          linear-gradient(to bottom, #fff 1px, transparent 1px);
        background-size: 64px 64px;
      }

      .content {
        position: relative;
        height: 100%;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .mark {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: #1c4a9e;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wordmark-text {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .wordmark-text span {
        color: #4a7fce;
      }

      h1 {
        font-size: 88px;
        font-weight: 800;
        line-height: 1.06;
        letter-spacing: -0.022em;
      }

      .underline {
        position: relative;
        display: inline-block;
      }

      /* Painted above the parent background but below .underline-text, which
         carries its own stacking context. A negative z-index would drop the
         swash behind the page background entirely. */
      .underline::after {
        content: '';
        position: absolute;
        left: -4px;
        bottom: 11px;
        width: calc(100% + 8px);
        height: 15px;
        background: rgba(232, 196, 104, 0.62);
        border-radius: 4px;
      }

      .underline-text {
        position: relative;
        z-index: 1;
      }

      .sub {
        margin-top: 26px;
        font-size: 30px;
        font-weight: 500;
        line-height: 1.42;
        color: rgba(255, 255, 255, 0.68);
        max-width: 830px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 26px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 22px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
        align-self: flex-start;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 9999px;
        background: #e8c468;
      }
    </style>
  </head>
  <body>
    <div class="blob blob-brand-600"></div>
    <div class="blob blob-brand-500"></div>
    <div class="blob blob-gold"></div>
    <div class="grid"></div>

    <div class="content">
      <div class="wordmark">
        <div class="mark">
          <svg
            width="38"
            height="38"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
          </svg>
        </div>
        <div class="wordmark-text">Campus<span>Quest</span></div>
      </div>

      <div>
        <h1>
          Discover more of
          <span class="underline"><span class="underline-text">college.</span></span>
        </h1>
        <p class="sub">
          Clubs, events, and opportunities matched to your interests — surfaced
          every week, automatically.
        </p>
      </div>

      <div class="badge">
        <span class="dot"></span>
        Pilot launching at the University of Rhode Island
      </div>
    </div>
  </body>
</html>
